name: ci

on:
  push:
  pull_request:

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the ledger (strict; must pass)
        run: python validate_ledger.py inference_timing_ledger.csv --strict

      - name: Confirm the validator rejects the invalid fixture
        run: |
          if python validate_ledger.py examples/ledger_invalid_example.csv; then
            echo "::error::the validator accepted a deliberately invalid ledger"
            exit 1
          fi
          echo "validator correctly rejected the invalid fixture"
