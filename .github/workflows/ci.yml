name: ci

on:
  push:
  pull_request:

jobs:
  validate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the ledger (strict; must pass)
        run: python validate_ledger.py inference_timing_ledger.csv --strict

      - name: Confirm the validator rejects the invalid fixture
        run: |
          # The fixture must be rejected at all ...
          if python validate_ledger.py examples/ledger_invalid_example.csv; then
            echo "::error::the validator accepted a deliberately invalid ledger"
            exit 1
          fi
          # ... and for every intended reason (exact findings count, via --json).
          EXPECTED="16 17"   # errors warnings
          ACTUAL=$(python validate_ledger.py examples/ledger_invalid_example.csv --json \
                   | python -c "import json,sys; r=json.load(sys.stdin); print(r['error_count'], r['warning_count'])")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::fixture findings changed: expected '$EXPECTED' (errors warnings), got '$ACTUAL' - update the fixture or the expected counts in ci.yml"
            exit 1
          fi
          echo "validator correctly rejected the invalid fixture (errors warnings: $ACTUAL)"
